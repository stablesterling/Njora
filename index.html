<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Njora — Luxury Jewelry Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12251b;
      --panel: #0e0e10;
      --muted: #bdb6af;
      --gold: #B5A067;
      --accent: linear-gradient(135deg, #f7e6b8 0%, #ffd664 50%, #b7832e 100%);
      --glass: rgba(255, 255, 255, 0.03);
      --whatsapp: #25d366;
    }

    html, body { height: 100%; margin: 0; padding: 0; scroll-behavior: smooth; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255, 255, 255, 0.02), transparent), var(--bg);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* --- INTRO OVERLAY --- */
    #intro {
      position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #060506 0%, #000000 100%);
    }
    #intro.hide { animation: introHide 0.7s ease forwards; }
    @keyframes introHide {
      0% { opacity: 1; filter: blur(0px); }
      100% { opacity: 0; filter: blur(18px); visibility: hidden; }
    }
    #intro .logo {
      font-family: 'Playfair Display'; font-size: 72px; letter-spacing: 6px;
      background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: logoPop 1.8s cubic-bezier(.2,.9,.3,1) forwards;
    }

    /* --- SEARCH STYLING --- */
    .search-box {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(181, 160, 103, 0.3);
      border-radius: 8px;
      color: white;
      margin-bottom: 20px;
      font-family: 'Inter';
      outline: none;
      transition: border 0.3s;
    }
    .search-box:focus { border: 1px solid var(--gold); }

    /* --- NAVBAR --- */
    .navbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 12px 24px;
      position: sticky; top: 0;
      background: rgba(18, 37, 27, 0.8);
      backdrop-filter: blur(12px);
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .brand { grid-column: 2; display: flex; justify-content: center; }

    /* --- LAYOUT --- */
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 30px;
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.02);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .filter-btn {
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.3s, transform 0.2s;
    }
    .filter-btn:hover { color: var(--gold); transform: translateX(5px); }
    .filter-btn.active { color: var(--gold); font-weight: 600; }

    /* --- GRID --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }
    .card {
      background: rgba(255, 255, 255, 0.02);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--gold);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

    .card .media {
      height: 250px;
      background: #000;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card .media img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
    .card:hover .media img { transform: scale(1.1); }

    .whatsapp-btn {
      position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
      background: var(--whatsapp); border-radius: 50%; display: flex;
      align-items: center; justify-content: center; color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000;
    }

    .footer { padding: 40px 20px; background: #0a0a0a; text-align: center; margin-top: auto; }

    @media (max-width: 1000px) {
      .layout { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .sidebar { position: relative; top: 0; }
    }
  </style>
</head>

<body>
  <div id="intro"><div class="logo">NJORA</div></div>

  <header class="navbar">
    <div class="brand">
      <h1 style="font-family:'Playfair Display'; color:var(--gold); margin:0; letter-spacing: 3px;">NJORA</h1>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div style="color:var(--gold); font-family:'Playfair Display'; margin-bottom:10px; font-weight:700;">Find a Piece</div>
      <input type="text" id="searchInput" class="search-box" placeholder="Search rings, necklaces...">

      <div style="color:var(--gold); font-family:'Playfair Display'; margin-bottom:15px; font-weight:700;">Collections</div>
      <div style="display:flex; flex-direction:column; gap:12px; color:var(--muted); font-size:14px;">
        <span class="filter-btn active" onclick="filterByWord('All')">All Pieces</span>
        <span class="filter-btn" onclick="filterByWord('Diamond')">Diamond</span>
        <span class="filter-btn" onclick="filterByWord('Gold')">Gold</span>
        <span class="filter-btn" onclick="filterByWord('Bespoke')">Bespoke</span>
      </div>
      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05); margin:20px 0;">
    </aside>

    <section>
      <div class="grid" id="productGrid"></div>
      <div id="noResults" style="display:none; text-align:center; padding:50px; color:var(--muted);">No matching pieces found.</div>
    </section>
  </main>

  <footer class="footer">
    <h2 style="font-family:'Playfair Display'; color:var(--gold);">Njora</h2>
    <p style="color:var(--muted); font-size:12px;">© 2026 Njora Luxury Jewelry — All Rights Reserved</p>
  </footer>

  <a href="https://chat.whatsapp.com/YOUR_COMMUNITY_LINK" class="whatsapp-btn" target="_blank">
    <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.414 0 .018 5.396.015 12.03c0 2.12.554 4.189 1.604 6.013L0 24l6.135-1.61a11.77 11.77 0 005.91 1.586h.005c6.635 0 12.032-5.396 12.035-12.031a11.737 11.737 0 00-3.417-8.498z"/>
    </svg>
  </a>

  <script>
    const products = [
      { title: 'Celeste Diamond Ring', price: '₹ 1,45,000', desc: '14k white gold band, Conflict-free diamond.', img: 'https://raw.githubusercontent.com/stablesterling/NJORA/main/photos/Gemini_Generated_Image_pi3kh9pi3kh9pi3k.png' },
      { title: 'Luna Pearl Necklace', price: '₹ 89,500', desc: 'South-sea pearl with handcrafted 18k gold chain.', img: '' },
      { title: 'Orion Earrings', price: '₹ 54,750', desc: 'Bold earrings set with citrine and gold filigree.', img: '' },
      { title: 'Serene Band', price: '₹ 24,900', desc: 'Elegant rose gold band with a satin finish.', img: '' },
      { title: 'Astra Bracelet', price: '₹ 62,300', desc: 'Sleek platinum bracelet with diamond accents.', img: '' },
      { title: 'Halcyon Brooch', price: '₹ 39,900', desc: 'Vintage-inspired brooch with ornate detailing.', img: '' },
      { title: 'Diamond Biyatch', price: '₹ 89,500', desc: 'Custom luxury piece.', img: '' }
    ];

    const grid = document.getElementById('productGrid');
    const noResults = document.getElementById('noResults');

    function renderProducts(items) {
      grid.innerHTML = '';
      if (items.length === 0) {
        noResults.style.display = 'block';
      } else {
        noResults.style.display = 'none';
        items.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          const mediaHTML = p.img 
            ? `<img src="${p.img}" alt="${p.title}" onerror="this.parentElement.innerHTML='No Image'">` 
            : `<span style="opacity:0.4; font-size:12px;">Coming Soon</span>`;

          card.innerHTML = `
            <div class="media">${mediaHTML}</div>
            <h3 style="font-family:'Playfair Display'; margin:10px 0 5px 0; color:var(--gold);">${p.title}</h3>
            <p style="color:var(--muted); font-size:13px; margin:0 0 10px 0;">${p.desc}</p>
            <div style="color:#fff; font-weight:700;">${p.price}</div>
          `;
          grid.appendChild(card);
        });
      }
    }

    // This function searches for the word in the TITLE
    window.filterByWord = function(word) {
      // Update UI active state
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.innerText === word || (word === 'All' && btn.innerText === 'All Pieces')) {
          btn.classList.add('active');
        }
      });

      // Clear the main search box so it doesn't conflict
      document.getElementById('searchInput').value = '';

      if (word === 'All') {
        renderProducts(products);
      } else {
        // Filter based on whether the title contains the word (ignoring case)
        const filtered = products.filter(p => 
          p.title.toLowerCase().includes(word.toLowerCase())
        );
        renderProducts(filtered);
      }
    };

    // Main Search Logic
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = products.filter(p => 
        p.title.toLowerCase().includes(term) || 
        p.desc.toLowerCase().includes(term)
      );
      renderProducts(filtered);
    });

    // Initial load
    renderProducts(products);

    window.addEventListener('load', () => {
      setTimeout(() => { document.getElementById('intro').classList.add('hide'); }, 1200);
    });
  </script>
</body>
</html>
